[tool.poetry]
name = "test-agent-backend"
version = "0.1.0"
description = "序舟 AI 工程工作台的可选本机服务骨架"
authors = ["Project Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
common-lib = { path = "packages/common-lib", develop = true }
api-gateway-service = { path = "packages/api-gateway-service", develop = true }
agent-runtime-service = { path = "packages/agent-runtime-service", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
httpx = "^0.25"
ruff = "^0.1"

[tool.pytest.ini_options]
testpaths = ["packages/api-gateway-service/tests", "packages/agent-runtime-service/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
