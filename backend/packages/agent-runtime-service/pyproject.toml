[tool.poetry]
name = "agent-runtime-service"
version = "0.1.0"
description = "测试 Agent 运行时骨架"
authors = ["Project Team"]
packages = [{ include = "agent_runtime", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
common-lib = { path = "../common-lib", develop = true }
fastapi = "^0.108"
uvicorn = { version = "^0.25", extras = ["standard"] }

[build-system]
requires = ["poetry-core>=1.7"]
build-backend = "poetry.core.masonry.api"
